[build-system]
requires = ["setuptools>=64,<82", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hod"
version = "0.1.0"
description = "Hierarchical Object Detection Project"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0.0,<2.2",
    "torchvision==0.16.0",
    "numpy>=1.24.0,<2.0",
    "pycocotools>=2.0.6",
    "tqdm>=4.65.0",
    "mmengine>=0.7.1",
    "mmcv>=2.0.0rc4,<2.2.0",
    "mmdet>=3.0.0",
    "setuptools>=42,<82",
]

[project.optional-dependencies]
analysis = [
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["hod*"]
